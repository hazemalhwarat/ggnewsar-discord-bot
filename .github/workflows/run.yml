name: GGNewsAR Discord Bot
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"  # كل 15 دقيقة — عدّل الرقم لو تبي أسرع أو أبطأ

permissions:
  contents: write  # مطلوب عشان يقدر يعمل commit/push لـ state.json

concurrency:
  group: ggnewsar-discord-bot
  cancel-in-progress: false  # ما نبي نلغي رن شغال لو الجديد بدأ قبل ما يخلص القديم

jobs:
  run:
    runs-on: ubuntu-latest
    # هذا الرقم هو شبكة أمان خارجية بس. الحماية الحقيقية من التعليق (hang)
    # صارت داخل bot.py نفسه (2026-08-29): فيه "soft deadline" داخلي (20
    # دقيقة) أقل من هذا الرقم، فأي مرحلة بالبوت (RSS أو Liquipedia) توقف
    # نفسها بأمان وتعمل checkpoint (حفظ + commit + push) قبل ما توصل لهون
    # أصلاً. لو شفت run يوصل فعلاً لـ 30 دقيقة ويتقتل من GitHub، هذا مؤشر
    # إنه صار شي غير متوقع تماماً (مو الأسباب المعروفة السابقة) ويستاهل
    # مراجعة اللوق مباشرة.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot (single pass)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # ملاحظة (2026-08-29): تصحيح لتعليق سابق كان يقول إن Gemini
          # "ما عاد مستخدم إطلاقاً" — هذا غير دقيق، bot.py لسا يستخدم
          # GEMINI_API_KEY فعلياً لتحليل كل خبر (عنوان رئيسي/فرعي/ملخص
          # بالفصحى). لو السر فاضي أو غير موجود، البوت يرجع تلقائياً
          # لإرسال العنوان/الملخص الخام من RSS بدون تحليل — مو انه يوقف.
          # فعليًا ما تحذف هالسر، خله موجود وصحيح إذا تبي التحليل يشتغل.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
