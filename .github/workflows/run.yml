name: GGNewsAR Discord Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # كل 15 دقيقة — عدّل الرقم لو تبي أسرع أو أبطأ

permissions:
  contents: write   # مطلوب عشان يقدر يعمل commit/push لـ state.json

concurrency:
  group: ggnewsar-discord-bot
  cancel-in-progress: false   # ما نبي نلغي رن شغال لو الجديد بدأ قبل ما يخلص القديم

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # رُفع من 13 (2026-08-22): كان هذا الرقم مربوط بمشكلة
    # التكرار ("سبام") اللي حازم لاحظها — لو الرن انقتل بسبب المهلة نص
    # طريق Phase C (يوم أخبار ثقيل + Gemini rate limit)، كانت الأخبار اللي
    # انبعتت فعلاً قبل القتل تنضاع من state.json لأنه ما كان يتحفظ إلا
    # بآخر الرن، فترجع تتبعت من جديد بالرن الجاي. الحل الحقيقي بـ bot.py:
    # checkpoint دوري (حفظ + commit) كل عدد قليل من الأخبار المُعالجة، مو
    # بس بالآخر — فصار انقتال الرن (لأي سبب) ما يسبب تكرار إطلاقاً. هذا
    # الرفع لـ 30 دقيقة إضافة احترازية فوق ذلك: يقلل احتمال الانقتال
    # أصلاً، فيوفر فرصة أكبر يخلص الرن كل أخباره بمرة وحدة بدل ما يتقطع
    # ويكمل بالرن الجاي (تأخير بسيط، مو خطأ، بفضل الـ checkpoint).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (single pass)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # ملاحظة (2026-08-23): GEMINI_API_KEY ما عاد مستخدم إطلاقاً —
          # البوت ألغى خطوة الذكاء الاصطناعي كاملة بناءً على طلب حازم،
          # وصار يرسل كل خبر إيسبورتس مباشرة بدون تحليل أو تصنيف عبر أي
          # API خارجي. تقدر تحذف هالسر من إعدادات الـ repo لو حاب، أو
          # تسيبه فاضي بدون أي أثر — bot.py ما عاد يقرأه أصلاً.
        run: python bot.py
